<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#102b32">
  <title>Bandicoot: Wild Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="Bandicoot Wild Run game">
    <canvas id="game" width="960" height="540" aria-label="Platform game"></canvas>
    <div class="topbar"><a class="brand" href="#" aria-label="Wild Run home"><span class="brand-mark">✦</span> WILD<span>RUN</span></a><div class="top-hint">A NEW ISLAND ADVENTURE</div><button id="sound" class="sound" aria-label="Toggle sound">♫ <span>ON</span></button></div>
    <div class="mobile-controls" aria-label="Touch controls">
      <div class="move-controls"><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div>
      <div class="action-controls"><button data-key="spin" aria-label="Spin attack">⟳</button><button data-key="jump" aria-label="Jump">↑</button></div>
    </div>
    <div class="footer"><span>© 2025 WILD RUN STUDIO</span><span class="footer-center">RUN WILD. FIND YOUR WAY.</span><span>DESIGNED FOR ADVENTURE</span></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
